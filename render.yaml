# Render Blueprint: one web service (Docker) plus a PostgreSQL database.
# In Render: New > Blueprint > pick this repo. Fill in the variables marked sync: false.
databases:
  - name: resrvit-db
    databaseName: resrvit
    user: resrvit
    plan: free

services:
  - type: web
    name: resrvit
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: resrvit-db
          property: connectionString
      - key: RESRVIT_CHAT_KEY        # 32-byte AES key, base64. Never change it once messages exist.
        sync: false
      - key: ADMIN_EMAIL             # first super admin, created on first start
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID        # optional: Google sign-in for @thapar.edu accounts
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESRVIT_BASE_URL        # e.g. https://resrvit.onrender.com (used in email links)
        sync: false
      - key: RESRVIT_SEED            # "true" loads the demo campus on an empty database
        value: "false"
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
