<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{bare :: page(~{::title}, ~{::main})}">
<head><title>Create account · ResrvIt</title></head>
<body>
<main>
    <h1 class="mb-1">Create an account</h1>
    <p class="text-muted">Only <strong th:text="'@' + ${domain}">@thapar.edu</strong> addresses. We'll email you a code, then an admin activates the account.</p>
    <form th:action="@{/signup}" method="post" class="vstack gap-3">
        <div>
            <label class="form-label" for="email">College email</label>
            <input class="form-control" id="email" name="email" type="email" required autocomplete="email"
                   th:value="${form?.email}" th:placeholder="'you@' + ${domain}">
        </div>
        <div>
            <label class="form-label" for="fullName">Full name</label>
            <input class="form-control" id="fullName" name="fullName" required autocomplete="name" th:value="${form?.fullName}">
        </div>
        <div class="row g-3">
            <div class="col-sm-6">
                <label class="form-label" for="role">I am</label>
                <select class="form-select" id="role" name="role">
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r.label}"
                            th:selected="${form != null and form.role == r}">Student</option>
                </select>
            </div>
            <div class="col-sm-6">
                <label class="form-label" for="rollNo">Roll number <span class="text-muted fw-normal">(students)</span></label>
                <input class="form-control" id="rollNo" name="rollNo" th:value="${form?.rollNo}">
            </div>
        </div>
        <div>
            <label class="form-label" for="departmentId">Department</label>
            <select class="form-select" id="departmentId" name="departmentId">
                <option value="">Choose…</option>
                <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"
                        th:selected="${form != null and form.departmentId == d.id}">CSED</option>
            </select>
        </div>
        <div class="row g-3">
            <div class="col-sm-6">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" id="password" name="password" type="password" minlength="8" required autocomplete="new-password">
                <div class="form-text">At least 8 characters.</div>
            </div>
            <div class="col-sm-6">
                <label class="form-label" for="confirm">Repeat password</label>
                <input class="form-control" id="confirm" name="confirm" type="password" minlength="8" required autocomplete="new-password">
            </div>
        </div>
        <button class="btn btn-primary btn-lg" type="submit">Send verification code</button>
    </form>
    <p class="mt-4 mb-0">Already have an account? <a th:href="@{/login}">Sign in</a></p>
</main>
</body>
</html>
