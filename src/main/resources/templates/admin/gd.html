<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head><title>GD queue · ResrvIt</title></head>
<body>
<main>
    <div class="page-head"><div><h1>GD room queue</h1>
        <p>Shared by both GD Room Admins. Claim a request to lock it to you, then approve or reject. Each slot is decided in queue order.</p></div></div>
    <div class="panel">
        <div class="panel-title"><h2>Waiting</h2></div>
        <div th:if="${pending.isEmpty()}" class="empty">Nothing waiting.</div>
        <ol class="lane" th:unless="${pending.isEmpty()}">
            <li th:each="b : ${pending}">
                <div>
                    <a class="fw-semibold" th:href="@{/bookings/{id}(id=${b.id})}" th:text="${b.room.name} + ', ' + ${b.whenLabel}"></a>
                    <div class="lane-meta" th:text="${b.forLabel} + (${b.reasonText != null} ? ' · ' + ${b.reasonText} : '')"></div>
                    <div class="lane-meta" th:if="${b.claimedBy != null}" th:text="'Claimed by ' + ${b.claimedBy.fullName}"></div>
                </div>
                <div class="d-flex gap-2 flex-wrap justify-content-end">
                    <form th:if="${b.claimedBy == null}" th:action="@{/bookings/{id}/claim(id=${b.id})}" method="post"><button class="btn btn-sm btn-outline-secondary">Claim</button></form>
                    <th:block th:if="${b.claimedBy != null and b.claimedBy.id == me.id}">
                        <form th:action="@{/bookings/{id}/approve(id=${b.id})}" method="post"><button class="btn btn-sm btn-success">Approve</button></form>
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/bookings/{id}(id=${b.id})}">Reject…</a>
                        <form th:action="@{/bookings/{id}/release(id=${b.id})}" method="post"><button class="btn btn-sm btn-link">Release</button></form>
                    </th:block>
                </div>
            </li>
        </ol>
    </div>
    <div class="panel" th:unless="${freed.isEmpty()}">
        <div class="panel-title"><h2>Cancelled slots to reassign</h2></div>
        <table class="table"><tr th:each="b : ${freed}"><td><a th:href="@{/bookings/{id}(id=${b.id})}" th:text="${b.room.name} + ', ' + ${b.whenLabel}"></a></td><td th:text="${b.forLabel}"></td></tr></table>
    </div>
    <div class="panel">
        <div class="panel-title"><h2>Approved, upcoming</h2></div>
        <div th:if="${approved.isEmpty()}" class="empty">None.</div>
        <div th:unless="${approved.isEmpty()}"><table th:replace="~{fragments :: table(${approved})}"></table></div>
    </div>
</main>
</body>
</html>
