<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head><title>Group · ResrvIt</title></head>
<body>
<main>
    <div class="page-head">
        <div>
            <h1 th:text="${g.name}">Group</h1>
            <p th:text="${g.courseCode} + (${g.projectTitle != null} ? ' · ' + ${g.projectTitle} : '') + ' · ' + ${g.status.label}"></p>
        </div>
        <div class="d-flex gap-2" th:if="${myRow != null and !myRow.confirmed and g.status.name() == 'PENDING_CONFIRMATION'}">
            <form th:action="@{/groups/{id}/confirm(id=${g.id})}" method="post"><button class="btn btn-success">Confirm I'm in</button></form>
            <form th:action="@{/groups/{id}/decline(id=${g.id})}" method="post"><button class="btn btn-outline-secondary">Decline</button></form>
        </div>
        <div class="d-flex gap-2" th:if="${canDecide}">
            <form th:action="@{/groups/{id}/decision(id=${g.id})}" method="post"><input type="hidden" name="approve" value="true"><button class="btn btn-success">Approve group</button></form>
            <form th:action="@{/groups/{id}/decision(id=${g.id})}" method="post"><input type="hidden" name="approve" value="false"><button class="btn btn-outline-danger">Don't approve</button></form>
        </div>
    </div>
    <div class="alert alert-info" th:if="${locked}">Membership is locked while the group has an active booking.</div>
    <div class="row g-4">
        <div class="col-lg-6">
            <div class="panel">
                <div class="panel-title"><h2>Members</h2></div>
                <table class="table align-middle">
                    <tr th:each="m : ${g.members}">
                        <td><span class="fw-semibold" th:text="${m.user.displayName}"></span>
                            <span class="tag ms-1" th:if="${m.user.id == g.leader.id}">Leader</span>
                            <span class="tag tag-wait ms-1" th:unless="${m.confirmed}">Not confirmed</span></td>
                        <td class="text-end">
                            <form th:if="${(isLeader or canEdit) and m.user.id != g.leader.id and g.status.name() != 'DISSOLVED'}"
                                  th:action="@{/groups/{id}/leader(id=${g.id})}" method="post" class="d-inline">
                                <input type="hidden" name="userId" th:value="${m.user.id}"><button class="btn btn-sm btn-link">Make leader</button></form>
                            <form th:if="${canEdit and !locked and m.user.id != g.leader.id and g.status.name() != 'DISSOLVED'}"
                                  th:action="@{/groups/{id}/members/{u}/remove(id=${g.id},u=${m.user.id})}" method="post" class="d-inline">
                                <button class="btn btn-sm btn-link text-danger">Remove</button></form>
                        </td>
                    </tr>
                </table>
                <form th:if="${canEdit and !locked and g.status.name() != 'DISSOLVED'}" th:action="@{/groups/{id}/members(id=${g.id})}" method="post" class="input-group mt-3">
                    <select class="form-select" name="userId" aria-label="Student to add">
                        <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.displayName}"></option>
                    </select>
                    <button class="btn btn-outline-primary">Add member</button>
                </form>
                <form th:if="${canEdit and g.status.name() != 'DISSOLVED'}" th:action="@{/groups/{id}/dissolve(id=${g.id})}" method="post" class="mt-3"
                      data-confirm="Dissolve this group?"><button class="btn btn-sm btn-outline-danger">Dissolve group</button></form>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="panel">
                <div class="panel-title"><h2>Group bookings</h2></div>
                <div th:if="${bookings.isEmpty()}" class="empty">None yet. The leader books for the group from the equipment form.</div>
                <div th:unless="${bookings.isEmpty()}"><table th:replace="~{fragments :: table(${bookings})}"></table></div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
