<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">ResrvIt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" th:href="@{/img/favicon.svg}" type="image/svg+xml">
</head>
<body>
<div class="auth-wrap">
    <aside class="auth-side">
        <div class="navbar-brand fs-3 fw-bold" style="font-family:'Bricolage Grotesque',sans-serif">Resrv<span style="color:#f19a8c">It</span></div>
        <div>
            <p class="big">Rooms and lab equipment, shared fairly.</p>
            <p class="mt-3 mb-0" style="max-width:42ch">Request a slot, wait your turn in a visible queue, and pick up with a QR code. Limits and approvals keep it fair for everyone on campus.</p>
            <div class="slots" aria-hidden="true">
                <span class="b"></span><span></span><span class="g"></span><span></span>
                <span></span><span class="g"></span><span class="b"></span><span></span>
                <span class="g"></span><span></span><span></span><span class="b"></span>
            </div>
        </div>
        <small style="color:#9fb0c2">Campus room and equipment booking</small>
    </aside>
    <section class="auth-form">
        <div>
            <div class="alert alert-success" role="status" th:if="${success}" th:text="${success}">Done.</div>
            <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}">Error.</div>
            <main th:replace="${content}"></main>
        </div>
    </section>
</div>
</body>
</html>
